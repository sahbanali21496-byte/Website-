<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Account Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }
        #startBtn {
            padding: 20px 50px;
            font-size: 28px;
            background: #00aa44;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 30px;
            box-shadow: 0 0 20px #00ff88;
            transition: all 0.3s;
        }
        #startBtn:hover {
            background: #00ff88;
            color: black;
            transform: scale(1.1);
        }
        #startBtn:disabled {
            background: #444;
            cursor: not-allowed;
        }
        #log {
            width: 90%;
            max-width: 800px;
            height: 400px;
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            padding: 20px;
            border: 2px solid #00aa44;
            overflow-y: auto;
            border-radius: 10px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Instagram Account Generator</h1>
    <button id="startBtn">Start Generation</button>
    <div id="log">Waiting to start...</div>

    <script>
        const btn = document.getElementById('startBtn');
        const log = document.getElementById('log');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = "Generating...";
            log.innerHTML = "Starting...\n";

            const eventSource = new EventSource('/generate');

            eventSource.onmessage = function(event) {
                log.innerHTML += event.data + "\n";
                log.scrollTop = log.scrollHeight;
            };

            eventSource.onerror = function() {
                log.innerHTML += "\nConnection closed.\n";
                btn.disabled = false;
                btn.textContent = "Start Generation";
                eventSource.close();
            };
        });
    </script>
</body>
</html>
